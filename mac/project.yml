name: Jarvis
options:
  bundleIdPrefix: com.msoft.blejarvis
  deploymentTarget:
    macOS: "14.0"
targets:
  Jarvis:
    type: application
    platform: macOS
    sources: [Jarvis]
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleName: Jarvis
        CFBundleDisplayName: BLE Jarvis
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Jarvis detects your iPhone's presence over Bluetooth to know when you arrive at and leave your desk.
        NSMicrophoneUsageDescription: Jarvis listens for your spoken replies after a briefing.
    settings:
      base:
        SWIFT_VERSION: "5.10"
        # Stable dev signing so TCC (Bluetooth/mic) permissions survive
        # rebuilds; falls back to ad-hoc on machines without the identity.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 359R7KZAFR
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
  JarvisTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JarvisTests]
    dependencies:
      - target: Jarvis
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  JarvisSmoke:
    type: tool
    platform: macOS
    sources:
      - Smoke
      - Jarvis/Agent
      - Jarvis/Tools
    settings:
      base:
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    test:
      targets:
        - JarvisTests
